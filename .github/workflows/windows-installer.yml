name: Build Watchmaker Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VITE_WATCHMAKER_CATALOG_URL: https://happyvonlosealot.github.io/watchmaker-catalog/v1
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare bundled local language model
        run: npm run model:prepare

      - name: Run tests and production frontend build
        run: npm run check

      - name: Verify bundled semantic matching
        run: npm run model:verify

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Build Windows installer
        run: npm run build:windows

      - name: Prepare verified installer artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "The Watchmaker installer was not created." }
          $output = "release-artifacts/Watchmaker-Setup-v1.0.9.exe"
          Copy-Item $installer.FullName $output
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Watchmaker-Setup-v1.0.9.exe" | Set-Content "release-artifacts/Watchmaker-Setup-v1.0.9.sha256" -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Watchmaker-1.0.9-Windows
          path: desktop/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
